version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pdfgen_postgres
    environment:
      POSTGRES_USER: pdfgen
      POSTGRES_PASSWORD: pdfgen123
      POSTGRES_DB: pdfgen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfgen -d pdfgen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdfgen_network

  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: pdfgen_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdfgen_network

  # MinIO - S3-compatible object storage (optional)
  minio:
    image: minio/minio:latest
    container_name: pdfgen_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pdfgen_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: pdfgen_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pdfgen:pdfgen123@postgres:5432/pdfgen_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: pdf-reports
      STORAGE_BACKEND: LOCAL  # Change to MINIO or S3 as needed
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdfgen_network

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: pdfgen_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws
    ports:
      - "8080:8080"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - pdfgen_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pdfgen_network:
    driver: bridge
